plugins { id 'com.android.application' }
android {
    namespace 'app.opencodemobile'
    compileSdk 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'app.opencodemobile'
        minSdk 29
        targetSdk 35
        versionCode 8
        versionName '1.0.7'
        testInstrumentationRunner 'app.opencodemobile.PhoneCheck'
    }
    signingConfigs {
        release {
            def keyFile = System.getenv('OPENCODE_STORE_FILE')
            if (keyFile) storeFile file(keyFile)
            storePassword System.getenv('OPENCODE_STORE_PASSWORD')
            keyAlias System.getenv('OPENCODE_KEY_ALIAS')
            keyPassword System.getenv('OPENCODE_KEY_PASSWORD')
        }
    }
    buildTypes {
        release {
            debuggable false
            signingConfig signingConfigs.release
        }
    }
}
